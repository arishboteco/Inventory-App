<form method="post" action="" class="space-y-3">
  {% csrf_token %}
  <input type="hidden" name="submit_receive" value="1" />
  {{ receive_form.as_p }}
  <div class="flex items-center justify-end gap-2">
    <button type="button" data-close class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none bg-white text-gray-700 border border-border hover:bg-secondaryHover focus:ring-2 focus:ring-primary">Cancel</button>
    <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none bg-primary text-white hover:bg-primaryHover focus:ring-2 focus:ring-primary">Record</button>
  </div>
</form>
