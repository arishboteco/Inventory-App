<!DOCTYPE html>
<html>
<head>
    <title>Test Add Component</title>
    <script>
        function testAddComponent() {
            console.log('=== TESTING ADD COMPONENT ===');

            // Check if elements exist
            const addBtn = document.getElementById('add-row');
            const totalForms = document.getElementById('id_components-TOTAL_FORMS');
            const emptyRow = document.getElementById('components-empty-row');
            const tbody = document.querySelector('#components-table tbody');

            console.log('Elements found:', {
                addBtn: !!addBtn,
                totalForms: !!totalForms,
                emptyRow: !!emptyRow,
                tbody: !!tbody
            });

            if (addBtn) {
                console.log('Add button found, clicking...');
                addBtn.click();
            } else {
                console.error('Add button NOT found!');
            }
        }

        // Test when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, waiting 2 seconds then testing...');
            setTimeout(testAddComponent, 2000);
        });
    </script>
</head>
<body>
    <h1>Test Page - Open Browser Console</h1>
    <p>This page will test the Add Component functionality. Open the browser console to see logs.</p>
    <button onclick="testAddComponent()">Manual Test</button>

    <!-- Simulate form structure -->
    <form>
        <input type="hidden" id="id_components-TOTAL_FORMS" value="0">
        <table id="components-table">
            <tbody>
                <!-- Empty for now -->
            </tbody>
        </table>

        <!-- Empty row template -->
        <tr class="form-row hidden" id="components-empty-row">
            <td>Component template row</td>
        </tr>

        <button type="button" id="add-row">Add Component</button>
    </form>
</body>
</html>
