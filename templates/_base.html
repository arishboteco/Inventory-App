{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Inventory App{% endblock %}</title>
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css">
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    <script src="{% static 'js/predictive-dropdown.js' %}"></script>
    <script src="{% static 'js/notifications.js' %}"></script>
    <script src="{% static 'js/nav.js' %}"></script>
    <script src="{% static 'js/formset.js' %}"></script>
    <script src="{% static 'js/table-sort.js' %}"></script>
    <script src="{% static 'js/tabs.js' %}"></script>
  </head>
  <body class="min-h-screen bg-gray-50">
    <!-- Top Navigation -->
    {% include "components/top_nav.html" %}
    
    <!-- Main Content Area -->
    <div class="min-h-screen">
      <!-- Unified Notification Container (managed by notifications.js) -->
      <div id="notification-container" class="fixed top-20 right-4 space-y-2 z-50 max-w-sm" aria-live="polite" aria-label="Notifications"></div>
      
      <!-- Loading Spinner -->
      <div
        id="htmx-spinner"
        role="status"
        aria-live="polite"
        class="hidden fixed inset-0 flex items-center justify-center bg-black/25 z-50"
      >
        <div
          aria-hidden="true"
          class="h-12 w-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"
        ></div>
      </div>
      
      <!-- Page Content -->
      <main class="page-content">
        {% if messages %}
          {% include "components/alert.html" %}
        {% endif %}
        {% block content %}{% endblock %}
      </main>
      
      <!-- Footer -->
      {% include "components/footer.html" %}
    </div>
    <script>
      const body = document.body;
      const spinner = document.getElementById('htmx-spinner');

      body.addEventListener('htmx:request', function () {
        spinner.classList.remove('hidden');
        body.setAttribute('aria-hidden', 'true');
        body.setAttribute('aria-busy', 'true');
      });

      body.addEventListener('htmx:afterRequest', function () {
        spinner.classList.add('hidden');
        body.removeAttribute('aria-hidden');
        body.removeAttribute('aria-busy');
      });
    </script>
  </body>
</html>
