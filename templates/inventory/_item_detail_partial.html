<div class="card" style="max-width:720px">
  <div class="card-header flex items-center justify-between">
    <div class="font-semibold">{{ item.name }}</div>
    <button type="button" data-modal-close class="inline-flex items-center justify-center p-1 text-gray-500 hover:text-gray-700 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary" title="Close" aria-label="Close">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="card-body">
    <dl class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:.5rem 1rem">
      {% for label, value in rows %}
      <div>
        <dt class="text-xs text-gray-500">{{ label }}</dt>
        <dd class="text-sm text-gray-900">{{ value }}</dd>
      </div>
      {% endfor %}
    </dl>
    <hr class="my-4" />
    <h4 class="text-sm font-medium text-gray-700 mb-2">Recent Activity</h4>
    <ul class="space-y-1 text-sm text-gray-700">
      {% for tx in recent_activity %}
      <li class="flex items-center justify-between">
        <span>{{ tx.transaction_type }} ({{ tx.quantity }})</span>
        <span class="text-gray-500">{{ tx.transaction_date|date:"Y-m-d H:i" }}</span>
      </li>
      {% empty %}
      <li class="text-gray-500">No recent activity.</li>
      {% endfor %}
    </ul>
  </div>
</div>
