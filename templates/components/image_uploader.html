<form method="post" enctype="multipart/form-data" class="mb-4">
  {% csrf_token %}
  <div class="flex items-start gap-4 overflow-hidden">
    {% if image_url %}
      <img src="{{ image_url }}" alt="Current thumbnail" class="w-24 max-w-full h-auto object-contain rounded flex-shrink-0" />
    {% endif %}
    <div class="flex flex-col gap-2">
      <label for="id_thumbnail" class="font-semibold">Thumbnail</label>
      <input type="file" name="thumbnail" id="id_thumbnail" accept="image/*" class="block" />
      <button type="submit" class="inline-flex items-center px-4 py-2 text-label font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary">Upload</button>
    </div>
  </div>
</form>
