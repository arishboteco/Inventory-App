<div class="bg-surface border border-border rounded-2xl shadow-card overflow-hidden mb-4">
  <details {% block open %}{% endblock %} class="group">
    <summary class="px-4 py-3 border-b border-border bg-surfaceSubtle cursor-pointer">
      <h2 class="text-h2 md:text-h2 font-semibold text-bodyText">{% block title %}{% endblock %}</h2>
    </summary>
    <div class="p-4 space-y-4">
      {% block content %}{% endblock %}
    </div>
  </details>
</div>
