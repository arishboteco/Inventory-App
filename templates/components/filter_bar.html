<form id="filters" class="flex flex-wrap md:flex-nowrap items-end gap-2 md:gap-3 mb-0 w-full" method="get">
  <div class="flex flex-col md:flex-none min-w-[9rem] md:min-w-[9rem] md:basis-[clamp(9rem,14vw,15rem)] md:flex-1">
      <label for="filter-q" class="text-label text-xs font-medium text-gray-700 truncate md:max-w-[8rem]">{{ search_label|default:'Search' }}</label>
      <input
        id="filter-q"
        type="text"
        name="q"
        autocomplete="off"
        placeholder="{{ search_placeholder }}"
        class="block w-full h-9 px-3 pr-9 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
        value="{{ q }}"
        hx-get="{{ hx_get }}"
        hx-target="{{ hx_target }}"
        hx-trigger="keyup changed delay:{{ search_delay|default:'300ms' }}"
        hx-include="#filters"
        {% if hx_indicator %}hx-indicator="{{ hx_indicator }}"{% endif %}
      />
    </div>
    {% for f in filters %}
      <div class="flex flex-col md:flex-none min-w-[9rem] md:min-w-[9rem] md:basis-[clamp(9rem,14vw,15rem)] md:flex-1">
        <label for="{{ f.id|default:f.name }}" class="text-label text-xs font-medium text-gray-700 truncate md:max-w-[8rem]">{{ f.label|default:f.name|capfirst }}</label>
        <select
          name="{{ f.name }}"
          class="block w-full h-9 px-3 pr-9 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary{% if predictive_names and f.name in predictive_names %} predictive{% endif %}"
          hx-get="{{ hx_get }}"
          hx-target="{{ hx_target }}"
          hx-trigger="change"
          hx-include="#filters"
          {% if hx_indicator %}hx-indicator="{{ hx_indicator }}"{% endif %}
          id="{{ f.id|default:f.name }}"
          autocomplete="off"
          {% if predictive_names and f.name in predictive_names %}
            data-placeholder="{{ f.label|default:f.name|capfirst }}"
          {% endif %}
        >
          {% for opt in f.options %}
            <option value="{{ opt.value }}"{% if opt.value == f.value %} selected{% endif %}>
              {{ opt.label|default:opt.value }}
            </option>
          {% endfor %}
        </select>
      </div>
    {% endfor %}
  {# Action buttons were moved out of the filter bar to the toolbar header #}
  {% if layout %}<input type="hidden" name="layout" value="{{ layout }}">{% endif %}
  {% if page_size %}<input type="hidden" name="page_size" value="{{ page_size|default:25 }}">{% endif %}
  {% if sort %}<input type="hidden" name="sort" value="{{ sort|default:'name' }}">{% endif %}
  {% if direction %}<input type="hidden" name="direction" value="{{ direction|default:'asc' }}">{% endif %}
  <noscript>
    <div class="mt-2">
      <button type="submit" class="inline-flex items-center px-4 py-2 text-label font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-primary text-white hover:bg-primaryHover focus:ring-2 focus:ring-primary">Apply</button>
    </div>
  </noscript>
</form>
