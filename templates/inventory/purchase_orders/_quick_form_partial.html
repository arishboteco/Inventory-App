<div class="bg-surface border border-border rounded-2xl shadow-overlay overflow-hidden drawer-panel max-w-drawer-sm">
  <div class="px-4 py-3 border-b border-border bg-surfaceSubtle flex items-center justify-between">
    <h3 class="text-lg font-semibold text-bodyText">Quick Purchase Order</h3>
    <button type="button" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary" data-modal-close>Close</button>
  </div>
  <div class="p-4">
    <form method="post" data-modal-form action="{% url 'purchase_order_quick_create_partial' %}">
      {% csrf_token %}
      <div class="space-y-4">
        <p class="text-sm text-gray-600">Create a draft purchase order. You'll be redirected to add line items.</p>
        {% include "components/form_field.html" with field=form.supplier %}
        {% include "components/form_field.html" with field=form.order_date %}
        <input type="hidden" name="status" value="DRAFT" />
      </div>
      <div class="flex justify-between items-center gap-2 mt-6 pt-4 border-t border-border">
        <button type="button" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary" data-modal-close>Cancel</button>
        <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-accent text-white hover:bg-accent-strong focus:ring-2 focus:ring-accent-strong">Create & Add Items</button>
      </div>
    </form>
  </div>
</div>
