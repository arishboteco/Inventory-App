{% load static %}
{# Reusable delete-confirmation modal.
   Trigger: confirmDelete(deleteUrl, itemName, entityType)
   The modal submits a POST form to deleteUrl with a CSRF token.
#}
<div id="confirmModal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
     style="display:none!important"
     role="dialog"
     aria-modal="true"
     aria-labelledby="confirmModalTitle">
  <div class="bg-surface rounded-2xl shadow-overlay w-full max-w-sm mx-4 p-6 space-y-4">
    <h3 id="confirmModalTitle" class="text-lg font-semibold text-bodyText">Confirm Delete</h3>
    <p id="confirmModalMessage" class="text-sm text-gray-600">Are you sure you want to delete this item?</p>
    <div class="flex justify-end gap-3 pt-2">
      <button id="confirmModalCancel"
              type="button"
              class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md border border-border bg-surface text-bodyText hover:bg-surfaceSubtle focus:outline-none focus:ring-2 focus:ring-primary">
        Cancel
      </button>
      <form id="confirmModalForm" method="post" class="inline">
        {% csrf_token %}
        <button type="submit"
                class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md bg-danger text-white hover:bg-danger-dark focus:outline-none focus:ring-2 focus:ring-danger">
          Delete
        </button>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById('confirmModal');
  var cancelBtn = document.getElementById('confirmModalCancel');
  var form = document.getElementById('confirmModalForm');

  function openConfirmModal(deleteUrl, itemName, entityType) {
    document.getElementById('confirmModalTitle').textContent = 'Delete ' + (entityType || 'item');
    document.getElementById('confirmModalMessage').textContent =
      'Are you sure you want to delete "' + itemName + '"? This action cannot be undone.';
    form.action = deleteUrl;
    modal.style.removeProperty('display');
  }

  function closeConfirmModal() {
    modal.style.setProperty('display', 'none', 'important');
  }

  cancelBtn.addEventListener('click', closeConfirmModal);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) { closeConfirmModal(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeConfirmModal(); }
  });

  // Expose globally so templates can call it
  window.confirmDelete = openConfirmModal;
})();
</script>
