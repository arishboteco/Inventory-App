{% extends "components/collapsible.html" %}
{% block title %}Quick Indent{% endblock %}
{% block content %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div class="grid gap-4 grid-cols-2 max-sm:grid-cols-1">
      {% for field in quick_form %}
        {% include "components/form_field.html" with field=field %}
      {% endfor %}
    </div>
    <div class="mt-4">
      <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-accent text-white hover:bg-accent-strong focus:ring-2 focus:ring-accent-strong">Submit</button>
    </div>
  </form>
{% endblock %}
