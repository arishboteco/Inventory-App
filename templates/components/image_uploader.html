<form method="post" enctype="multipart/form-data" class="mb-4 flex flex-col gap-2">
  {% csrf_token %}
  <label for="id_thumbnail" class="font-semibold">Thumbnail</label>
  {% if image_url %}
    <img src="{{ image_url }}" alt="Current thumbnail" class="h-24 w-24 object-cover rounded" />
  {% endif %}
  <input type="file" name="thumbnail" id="id_thumbnail" accept="image/*" class="block" />
  <button type="submit" class="inline-flex items-center px-3 py-2 text-sm font-medium text-bodyText bg-white border border-border rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed">Upload</button>
</form>
