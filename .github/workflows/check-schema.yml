name: Check Schema Consistency

on:
  pull_request:
  push:
    branches: [main, feature/*]

jobs:
  check-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      DATABASE_SSL_REQUIRE: "false"
      DJANGO_SETTINGS_MODULE: inventory_app.settings.dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Detect unwanted migrations
        run: python manage.py makemigrations --check --dry-run

      # ── Live schema comparison (optional, needs SUPABASE_URL secret) ──
      - name: Install PostgreSQL client 15
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15

      - name: Dump live Supabase schema
        if: ${{ secrets.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "🔎 Dumping live Supabase schema..."
          pg_dump --schema-only --no-owner --no-privileges "$SUPABASE_URL" \
            | grep -v '^\\restrict' \
            | grep -v '^\\unrestrict' \
            | grep -v '^-- Dumped by pg_dump' \
            > /tmp/live_schema.sql

      - name: Normalize repo schema
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: |
          grep -v '^\\restrict' db/schema.sql \
            | grep -v '^\\unrestrict' \
            | grep -v '^-- Dumped by pg_dump' \
            > /tmp/repo_schema.sql

      - name: Compare with repo schema.sql
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: |
          if ! diff -u /tmp/repo_schema.sql /tmp/live_schema.sql; then
            echo "❌ schema.sql is out of date with Supabase. Run pg_dump locally and commit."
            exit 1
          else
            echo "✅ schema.sql matches Supabase."
          fi

      - name: Schema comparison skipped
        if: ${{ secrets.SUPABASE_URL == '' }}
        run: echo "⚠️ SUPABASE_URL secret not configured — skipping live schema comparison."
