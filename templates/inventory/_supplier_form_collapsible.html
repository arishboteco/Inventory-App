{% extends "components/collapsible.html" %}
{% block title %}Add Supplier{% endblock %}
{% block content %}
  <form method="post" action="{% url 'suppliers_list' %}">
    {% csrf_token %}
    <div class="grid gap-4 grid-cols-2 max-sm:grid-cols-1">
      {% for field in form %}
        {% include "components/form_field.html" with field=field %}
      {% endfor %}
    </div>
    <div class="form-actions mt-4">
      <button type="reset" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary">Clear</button>
      <button type="submit" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-accent text-white hover:bg-accent-strong focus:ring-2 focus:ring-accent-strong">Create</button>
    </div>
  </form>
{% endblock %}
