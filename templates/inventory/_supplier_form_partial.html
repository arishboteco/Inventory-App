<div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden drawer-panel max-w-[480px]">
  <div class="px-4 py-3 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
    <h3 class="text-lg font-semibold">{% if is_edit %}Edit Supplier — {{ supplier.name }}{% else %}Add Supplier{% endif %}</h3>
    <button type="button" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-white text-gray-700 border border-border hover:bg-secondaryHover focus:ring-2 focus:ring-primary" data-modal-close>Close</button>
  </div>
  <div class="p-4">
    <form method="post" data-modal-form action="{% if is_edit %}{% url 'supplier_edit' supplier.supplier_id %}?partial=1{% else %}{% url 'supplier_create' %}?partial=1{% endif %}">
      {% csrf_token %}
      <input type="hidden" name="partial" value="1"/>
      <div class="grid gap-4 grid-cols-2 max-sm:grid-cols-1">
        {% for field in form %}
        <div class="space-y-1 col-span-2">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% include "forms/feedback.html" %}
        </div>
        {% endfor %}
        <div class="col-span-2 flex justify-between items-center gap-2">
          <button type="button" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-white text-gray-700 border border-border hover:bg-secondaryHover focus:ring-2 focus:ring-primary" data-modal-close>Cancel</button>
          <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-primary text-white hover:bg-primaryHover focus:ring-2 focus:ring-primary">{% if is_edit %}Save{% else %}Create{% endif %}</button>
        </div>
      </div>
    </form>
  </div>
</div>
