[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
  \.git
| \.mypy_cache
| \.pytest_cache
| \.venv
| build
| dist
| node_modules
)/
'''

[tool.isort]
profile = "black"
py_version = 313
line_length = 88

[tool.ruff]
target-version = "py313"
line-length = 88
# Enforce errors, warnings, pyflakes, import sorting, and E402 (module level import not at top)
extend-select = ["E", "F", "W", "I", "E402"]
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".venv",
  "build",
  "dist",
  "node_modules",
]

# Targeted lint relaxations for files where long literals or star imports are intentional
[tool.ruff.per-file-ignores]
"inventory/templatetags/icon_tags.py" = ["E501"]
"inventory/utils/category_migration.py" = ["E501", "W291", "W293"]
"inventory_app/settings/prod.py" = ["F403", "F405", "E501"]
"inventory_app/settings/staging.py" = ["F403", "F405"]
"tests/**" = ["E501", "E712"]
"tools/changelog.py" = ["E501"]
"inventory/views/stock.py" = ["E501"]
