{% extends "components/collapsible.html" %}
{% block title %}Add Recipe{% endblock %}
{% block open %}{% if form.errors %}open{% endif %}{% endblock %}
{% block content %}
  <form method="post">
    {% csrf_token %}
    {% include "inventory/recipes/_form_fields.html" with form=form %}
    <div class="flex gap-2">
      <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-accent text-white hover:bg-accent-strong focus:ring-2 focus:ring-accent-strong">Save</button>
    </div>
  </form>
{% endblock %}
