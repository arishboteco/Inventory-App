# RENDER.COM CONFIGURATION
# Using sync workers (resolves database threading errors).
#
# Cold-start latency (free tier):
#   Render free-tier web services sleep after 15 min of inactivity.
#   Options to reduce cold starts:
#     1. Upgrade to Starter plan ($7/mo) for always-on service.
#     2. Use an external uptime monitor (e.g. UptimeRobot) to ping
#        the healthCheckPath (/) every 10 min to prevent sleeping.
#
# Django Q worker:
#   The worker service below runs qcluster to process async tasks
#   (ML forecasting, ABC classification). Without it, async_task()
#   calls queue jobs that are never executed.
#   IMPORTANT: Render background workers require at least the Starter
#   plan. Remove or comment out the worker service if on the free plan.

services:
  - type: web
    name: inventory-app
    runtime: python3
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm install
      npm run build
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py setup_cache
      python manage.py create_default_superuser
      python manage.py reset_admin_password
    startCommand: >-
      gunicorn
      --bind 0.0.0.0:$PORT
      --workers 2
      --worker-class sync
      --max-requests 1000
      --max-requests-jitter 50
      --timeout 120
      --preload
      --access-logfile -
      --error-logfile -
      inventory_app.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_app.settings.prod
      - key: DEBUG
        value: False
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: True
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: 31536000
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: True
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: True
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /

  # Django Q background worker — requires Starter plan or above.
  # Comment out this service if running on the free plan.
  - type: worker
    name: inventory-app-worker
    runtime: python3
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_app.settings.prod
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: inventory-app
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        sync: false
