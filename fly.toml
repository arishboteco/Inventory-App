# fly.toml — Fly.io deployment config for Inventory Pro
# Docs: https://fly.io/docs/reference/configuration/

app = "inventory-pro"
primary_region = "sin"   # Singapore — change to nearest: syd, bom, lhr, iad, sjc

[build]
  dockerfile = "Dockerfile"
  [build.args]
    BUILD_ENV = "prod"

[env]
  DJANGO_SETTINGS_MODULE = "inventory_app.settings.prod"
  DEBUG = "False"
  DJANGO_SECURE_SSL_REDIRECT = "True"
  PORT = "8000"

# Run migrations automatically before each new version goes live
[deploy]
  release_command = "python manage.py migrate --noinput && python manage.py setup_cache && python manage.py create_default_superuser && python manage.py reset_admin_password"

# Process definitions — web server + Django Q background worker
[processes]
  web = "gunicorn inventory_app.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class sync --max-requests 1000 --max-requests-jitter 50 --timeout 120 --preload --access-logfile - --error-logfile -"
  worker = "python manage.py qcluster"

# HTTP service — routes traffic to the web process
[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # Health check — Fly restarts the machine if this fails
  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"
    protocol = "http"

# Machine sizing — shared-cpu-1x is free tier eligible
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]
