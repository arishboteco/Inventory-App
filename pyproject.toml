[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
  \.git
| \.mypy_cache
| \.pytest_cache
| \.venv
| build
| dist
| node_modules
)/
'''

[tool.isort]
profile = "black"
py_version = 313
line_length = 88

[tool.ruff]
target-version = "py313"
line-length = 88
extend-select = ["E", "F", "W", "I"]
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".venv",
  "build",
  "dist",
  "node_modules",
]
