version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: >
      sh -c "python manage.py migrate --settings=inventory_app.settings_production && \
             python manage.py collectstatic --noinput --settings=inventory_app.settings_production && \
             gunicorn inventory_app.wsgi:application \
               --bind 0.0.0.0:8000 \
               --workers 4 \
               --worker-class gevent \
               --worker-connections 1000 \
               --max-requests 1000 \
               --max-requests-jitter 100 \
               --timeout 30 \
               --keep-alive 2 \
               --env DJANGO_SETTINGS_MODULE=inventory_app.settings_production"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - log_volume:/var/log/django
    environment:
      - DJANGO_SETTINGS_MODULE=inventory_app.settings_production
    env_file:
      - env/production.local
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/var/backups/postgres
    environment:
      POSTGRES_DB: inventory_production
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_production"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backup service
  backup:
    image: postgres:15-alpine
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "
        while true; do
          echo 'Creating backup...'
          pg_dump -h db -U inventory_user -d inventory_production > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
          find /backups -name '*.sql' -mtime +30 -delete
          sleep 86400
        done
      "
    restart: unless-stopped

  # Monitoring service (optional)
  monitoring:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  log_volume:
    driver: local

networks:
  default:
    name: inventory_production
    driver: bridge
