# 🚀 RENDER.COM CONFIGURATION - FIXED THREADING ISSUES
# 🔧 Updated: 2025-08-27 - Using sync workers instead of gevent
# 🎯 This configuration resolves database threading errors

services:
  - type: web
    name: inventory-app
    runtime: python3
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm install  
      npm run build-css
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py create_default_superuser
      python manage.py reset_admin_password
    startCommand: >-
      gunicorn 
      --bind 0.0.0.0:$PORT 
      --workers 3 
      --worker-class sync 
      --max-requests 1000 
      --max-requests-jitter 50 
      --timeout 120
      --preload 
      --access-logfile - 
      --error-logfile - 
      inventory_app.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_app.settings_production
      - key: DEBUG
        value: False
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: True
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: 31536000
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: True
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: True
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: inventory-db
    databaseName: inventory_app
    user: inventory_user
