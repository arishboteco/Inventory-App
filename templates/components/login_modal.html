<div id="login-modal" class="fixed inset-0 hidden flex items-center justify-center bg-black/50 z-50 p-4">
  <div class="bg-surface border border-border text-bodyText p-6 rounded-xl shadow-lg w-full max-w-md relative">
    <button type="button" class="absolute top-2 right-2 text-bodyText hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary" data-close>
      <span class="sr-only">Close</span>
      &times;
    </button>
    <form method="post" class="grid gap-4">
      {% csrf_token %}
      {% for field in form %}
        {% include "components/form_field.html" with field=field %}
      {% endfor %}
      <button type="submit" class="inline-flex items-center px-4 py-2 text-label font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-primary text-white hover:bg-primaryHover focus:ring-2 focus:ring-primary w-full">Login</button>
    </form>
  </div>
</div>
<script>
  (function () {
    const modal = document.getElementById('login-modal');
    const openBtn = document.getElementById('open-login');
    const closeBtn = modal.querySelector('[data-close]');

    function open() {
      modal.classList.remove('hidden');
    }
    function close() {
      modal.classList.add('hidden');
    }
    openBtn && openBtn.addEventListener('click', open);
    closeBtn && closeBtn.addEventListener('click', close);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) {
        close();
      }
    });
  })();
</script>
