{% comment %}Basic table component with block areas for headers and rows{% endcomment %}
<table class="min-w-full w-full text-sm">
  <thead>
    <tr>
      {% block headers %}{% endblock %}
    </tr>
  </thead>
  <tbody class="bg-white divide-y divide-border">
    {% block rows %}{% endblock %}
  </tbody>
</table>
