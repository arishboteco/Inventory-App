<div class="card mb-4">
  <details {% block open %}{% endblock %}>
    <summary class="card-header cursor-pointer">
      <h2 class="text-h2 font-semibold">{% block title %}{% endblock %}</h2>
    </summary>
    <div class="card-body">
      {% block content %}{% endblock %}
    </div>
  </details>
</div>
