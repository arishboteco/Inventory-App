{% extends "components/collapsible.html" %}
{% block title %}Quick Purchase Order{% endblock %}
{% block content %}
<form method="post" class="space-y-4">
  {% csrf_token %}
  <div class="grid gap-4 grid-cols-2 max-sm:grid-cols-1">
    {% include "components/form_field.html" with field=quick_form.supplier %}
    {% include "components/form_field.html" with field=quick_form.order_date %}
  </div>
  <input type="hidden" name="{{ quick_form.prefix }}-status" value="DRAFT">
  <div class="mt-4 flex justify-end">
    <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-primary text-white hover:bg-primaryHover focus:ring-2 focus:ring-primary">Create</button>
  </div>
  <datalist id="supplier-options"></datalist>
</form>
{% endblock %}
