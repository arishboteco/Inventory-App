<div class="bg-surface rounded-2xl shadow-card border border-border overflow-hidden drawer-panel max-w-drawer-md">
  <div class="px-4 py-3 border-b border-border bg-surfaceSubtle flex items-center justify-between">
    <h3 class="text-lg font-semibold">{{ title|default:"Bulk Upload Items" }}</h3>
    <button type="button" class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary" data-modal-close>Close</button>
  </div>
  <div class="p-4">
    {% if upload_url %}
    <form method="post" enctype="multipart/form-data" data-modal-form action="{{ upload_url }}">
    {% else %}
    <form method="post" enctype="multipart/form-data" data-modal-form action="{% url 'upload_csv' %}?partial=1">
    {% endif %}
      {% csrf_token %}
      <input type="hidden" name="partial" value="1"/>
      {% if bulk_upload %}<input type="hidden" name="bulk_upload" value="1" />{% endif %}
      <div class="mb-3">
        <label for="{{ form.file.id_for_label }}" class="block text-sm font-medium text-bodyText mb-1">Select CSV File</label>
        {{ form.file }}
        {% include "forms/feedback.html" %}
      </div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-surface text-bodyText border border-border hover:bg-surfaceSubtle focus:ring-2 focus:ring-primary" data-modal-close>Cancel</button>
        <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed bg-accent text-white hover:bg-accent-strong focus:ring-2 focus:ring-accent-strong">Upload</button>
      </div>
    </form>
    <p class="text-sm text-gray-600 mt-3">{{ help_text|default:"CSV must include headers compatible with the item form fields." }}</p>
  </div>
</div>
