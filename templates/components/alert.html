{% for message in messages %}
  {# Preserve visible alert for non-JS and a11y #}
  {% if 'error' in message.tags %}
    <div class="p-4 mb-4 border-l-4 rounded-md bg-danger-soft text-danger border-danger-strong" role="alert">{{ message }}</div>
    <!-- toast: {{ message|escape }} -->
  {% elif 'warning' in message.tags %}
    <div class="p-4 mb-4 border-l-4 rounded-md bg-warning-soft text-warning border-warning-strong" role="alert">{{ message }}</div>
    <!-- toast: {{ message|escape }} -->
  {% elif 'success' in message.tags %}
    <div class="p-4 mb-4 border-l-4 rounded-md bg-success-soft text-success border-success-strong" role="alert">{{ message }}</div>
    <!-- toast: {{ message|escape }} -->
  {% else %}
    <div class="p-4 mb-4 border-l-4 rounded-md bg-accent-soft text-accent-text border-accent-strong" role="alert">{{ message }}</div>
    <!-- toast: {{ message|escape }} -->
  {% endif %}
{% endfor %}
